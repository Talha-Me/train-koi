    <!-- আসল React অ্যাপ এখানে মাউন্ট হবে -->

    <!-- গুগল অ্যাডসেন্স ও সার্চ ইঞ্জিনের জন্য টেক্সট কন্টেন্ট -->
    <noscript>
      <main style="padding: 24px; max-width: 900px; margin: 0 auto; color: #222;">
        <h1>ট্রেনকই - বাংলাদেশ রেলওয়ে লাইভ ট্রেন ট্র্যাকিং ও সময়সূচী</h1>
        <p>
          ট্রেনকই (TrainKoi) প্ল্যাটফর্মে আপনাকে স্বাগতম। এটি বাংলাদেশ রেলওয়ের সকল আন্তঃনগর ট্রেনের লাইভ লোকেশন, সঠিক সময়সূচী, ভাড়ার তালিকা, বন্ধের দিন এবং স্টেশনভিত্তিক রুট ম্যাপ জানার একটি সহজ ও নির্ভরযোগ্য ডিজিটাল প্ল্যাটফর্ম।
        </p>
        <h2>আমাদের প্রধান ফিচার ও সেবাসমূহ:</h2>
        <ul>
          <li><strong>লাইভ ট্রেন ট্র্যাকিং:</strong> রিয়েল-টাইম লোকেশন ও জিপিএস আপডেটের মাধ্যমে জানুন আপনার ট্রেন এখন কোন স্টেশনে অবস্থান করছে।</li>
          <li><strong>স্টেশনভিত্তিক সময়সূচী:</strong> ঢাকা, চট্টগ্রাম, রাজশাহী, সিলেট, খুলনা, রংপুরসহ সকল রুটের ট্রেনের আগমণ ও প্রস্থানের সঠিক সময়।</li>
          <li><strong>এসএমএস ট্র্যাকিং গাইড:</strong> মোবাইলের এসএমএস দিয়ে ট্রেনের সর্বশেষ লোকেশন জানার পূর্ণাঙ্গ নির্দেশনা।</li>
          <li><strong>ঢাকা মেট্রোরেল গাইড:</strong> এমআরটি লাইন-৬ এর সময়সূচী, ভাড়ার তালিকা ও র‍্যাপিড পাস ব্যবহারের নিয়ম।</li>
          <li><strong>ভ্রমণ আইন ও নিয়মাবলী:</strong> নিরাপদ ট্রেন ভ্রমণের জন্য রেলওয়ের অফিসিয়াল নীতিমালা ও টিকিট বুকিং নির্দেশিকা।</li>
        </ul>
        <h2>জরুরি নোটিশ ও দায়িত্বমুক্তি (Disclaimer):</h2>
        <p>
          ট্রেনকই বাংলাদেশ রেলওয়ের কোনো অফিশিয়াল সরকারি প্ল্যাটফর্ম নয়। এটি জনসাধারণের যাতায়াত সহজ করতে পাবলিক ডেটার ভিত্তিতে তৈরি একটি স্বাধীন প্ল্যাটফর্ম। নির্ভুল তথ্যের জন্য সর্বদা বাংলাদেশ রেলওয়ের অফিসিয়াল ওয়েবসাইট (eticket.railway.gov.bd) অনুসরণ করুন।
        </p>

      <p>
        বাংলাদেশ রেলওয়ের সকল আন্তঃনগর ও মেইল ট্রেনের শিডিউল, এসএমএস ট্র্যাকিং ও রুট ম্যাপের পূর্ণাঙ্গ তথ্য। ট্র্যাকিং করতে মেসেজ অপশনে TR লিখে ট্রেনের নম্বর লিখে ১৬৩১৮ নম্বরে পাঠান।
      </p>
